services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: challenge
      DB_USERNAME: challenge
      DB_PASSWORD: challenge
      SESSION_DRIVER: file
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
